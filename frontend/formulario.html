<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="estilo.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js.js"></script>
    
</head>

<body>
    <div class="container  p-5 mt-5 rounded shadow " >
        <h3 class="text-center">Formulário de Cadastro</h3>

        <div class="mb-3">
            <label for="nome_produto" class="form-label">Nome do Produto</label>
            <input type="text" class="form-control form-control-sm" id="nome_produto" name="nome_produto"
                placeholder="Digite o nome do produto">
        </div>
        <div class="mb-3 row">
            <div class="col">
                <label for="preco_produto" class="form-label">Preço do Produto</label>
                <div class="input-group mb-3 input-group-sm">
                    <span class="input-group-text ">R$</span>
                    <input type="text" class="form-control form-control-sm" aria-label="Amount (to the nearest dollar)"
                        id="preco_produto" name="preco_produto">
                    <span class="input-group-text ">,00</span>
                </div>

            </div>
            <div class="col">
                <label for="estoque" class="form-label">Estoque</label>
                <input type="number" step="1" min="0" class="form-control form-control-sm" id="estoque" name="estoque"
                    placeholder="Digite a quantidade em estoque">
            </div>
        </div>
        <div class="mb-3 row">
            <div class="col">
                <label for="proibido_menores" class="form-label">Proibido para menores de 18 anos?</label>
                <select class="form-select form-select-sm" id="proibido_menores" name="proibido_menores">
                    <option value="sim">Sim</option>
                    <option value="nao">Não</option>
                </select>
            </div>
            <div class="col">
                <label for="categoria" class="form-label">Categoria</label>
                <select class="form-select form-select-sm" id="categoria" name="categoria">
                    <option value="bebida">Bebida</option>
                    <option value="comida">Comida</option>
                    <option value="eletronico">Eletrônico</option>
                </select>
            </div>
        </div>
        <div class="mb-3 row">
            <div class="col-6">
                <label for="descricao" class="form-label">Descrição do Produto</label>
                <div class="form-floating">
                    <textarea class="form-control" style="height: 80px;" placeholder="Digite a descrição do produto"
                        id="descricao"></textarea>
                    <label for="descricao">
                        Descrição:
                    </label>
                </div>
            </div>
            <div class="col-3">
                <h5 class="form-label">Dias da Semana</h5>
                <div class="form-check form-switch custom-switch">
                    <input class="form-check-input ativa_dia" custom-control-input" type="checkbox" role="switch" id="ativa_domingo"
                        name="ativa_domingo">
                    <label class="form-check-label" for="ativa_domingo">Domingo</label>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input ativa_dia" type="checkbox" role="switch" id="ativa_segunda" 
                        name="ativa_segunda">
                    <label class="form-check-label" for="ativa_segunda">Segunda-Feira</label>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input ativa_dia" type="checkbox" role="switch" id="ativa_terca" name="ativa_terca">
                    <label class="form-check-label" for="ativa_terca">Terça-Feira</label>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input ativa_dia" type="checkbox" role="switch" id="ativa_quarta" name="ativa_quarta">
                    <label class="form-check-label" for="ativa_quarta">Quarta-Feira</label>
                </div>
            </div>
            <div class="col-3 mt-4">
                 
               
                <div class="form-check form-switch">
                    <input class="form-check-input ativa_dia" type="checkbox" role="switch" id="ativa_quinta" name="ativa_quinta">
                    <label class="form-check-label" for="ativa_quinta">Quinta-Feira</label>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input ativa_dia" type="checkbox" role="switch" id="ativa_sexta" name="ativa_sexta">
                    <label class="form-check-label" for="ativa_sexta">Sexta-Feira</label>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input ativa_dia" type="checkbox" role="switch" id="ativa_sabado" name="ativa_sabado">
                    <label class="form-check-label" for="ativa_sabado">Sábado</label>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input " type="checkbox" role="switch" id="ativa_todos" name="ativa_todos">
                    <label class="form-check-label" for="ativa_todos">Todos</label>
                </div>
            </div>
        </div>
        <div class="mb-3 row">
            <div class="col p-1">
                <label for="temperatura" class="form-label">Temperatura de Armazenamento</label>
                <input type="range" class="form-range" min="0" max="100" id="temperatura">

            </div>
            <div class="col p-1">
                <label for="horas_reposicao" class="form-label">Horas para reposição</label>
                <input type="range" class="form-range" min="0" max="24" id="horas_reposicao">

            </div>
        </div>
        <div class="mb-3 row">
            <div class="col">
                <label for="origem_produto" class="form-label">Origem do Produto</label>
                <div class="form-check">
                    <input class="form-check-input" type="radio" value="N" name="origem_produto" id="origem_nacional" checked>
                    <label class="form-check-label" for="origem_nacional">
                        Nacional
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" value="I" name="origem_produto" id="origem_importado">
                    <label class="form-check-label" for="origem_importado">
                        Importado
                    </label>
                </div>
            </div>

            <div class="col">
                <div class="input-group mb-3">
                    <label class="input-group-text" for="inputGroupFile01">Upload</label>
                    <input type="file" class="form-control" id="img">
                </div>

            </div>
        </div>

        <div class="mb-3 row justify-content-center d-flex">
            <div class="col justify-content-center d-flex">
                <button type="button" class="btn btn-primary" id="btn_cadastrar">Cadastrar</button>
            </div>
        </div>


    </div>

</body>

</html>
